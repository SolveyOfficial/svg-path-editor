name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build-prod

      # solvey.in/tools/<repository>/ is forwarded to the tools/<repository>/
      # folder of this site, so the same commit is built again for that path
      - name: Build the copy for solvey.in/tools
        run: |
          npx ng build --configuration production --base-href="/tools/$REPOSITORY/" --output-path=dist/tools-copy
          cp dist/svg-path-editor/browser/LICENSES.txt dist/tools-copy/browser/
          mkdir -p dist/svg-path-editor/browser/tools
          mv dist/tools-copy/browser "dist/svg-path-editor/browser/tools/$REPOSITORY"
        env:
          REPOSITORY: ${{ github.event.repository.name }}

      # Publishes to GitHub Pages once the repository is public
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/svg-path-editor/browser/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
